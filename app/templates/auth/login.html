{% extends 'base.html' %}

{% block title %}Login - FlaskStarter{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">🔐</div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to access your secure dashboard</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form" novalidate>
            <div class="form-group">
                <label for="login_identifier" class="form-label">Username or Email</label>
                <input
                    type="text"
                    id="login_identifier"
                    name="login_identifier"
                    class="form-control"
                    placeholder="Enter your username or email"
                    value="{{ login_identifier if login_identifier else '' }}"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="form-check-group">
                <label class="checkbox-container">
                    <input type="checkbox" name="remember" id="remember">
                    <span class="checkmark"></span>
                    Remember me on this device
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
        </div>
    </div>
</div>
{% endblock %}
