
services:
  web:
    build: .
    container_name: flaskstarter_app
    ports:
      - "5000:5000"
    environment:
      FLASK_CONFIG: production
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: sqlite:////app/instance/app.db
    volumes:
      - flask_data:/app/instance
    restart: unless-stopped

volumes:
  flask_data:
